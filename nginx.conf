worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # ── Upstream services ─────────────────────────────────────────────────────
    upstream node_api {
        server writewise-api:3001;
    }

    upstream python_stats {
        server writewise-stats:8000;
    }

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    server {
        listen 80;
        server_name _;

        # ── React SPA Static Files ────────────────────────────────────────────
        root /var/www/writewise;
        index index.html;

        # Serve static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Node.js API endpoints ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass         http://node_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        '';

            # SSE streaming support (for generate-narrative)
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
        }

        # ── Python Statistics Engine ──────────────────────────────────────────
        location /stats/ {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass         http://python_stats/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── Health checks ─────────────────────────────────────────────────────
        location /health {
            proxy_pass http://node_api/health;
        }

        location /stats/health {
            proxy_pass http://python_stats/health;
        }

        # ── SPA Fallback: all other routes → React index.html ─────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
